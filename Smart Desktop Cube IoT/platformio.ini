; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_8MB.csv
monitor_speed = 115200
monitor_echo = yes
monitor_eol = CRLF
monitor_filters = default, time, esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
	claws/BH1750@^1.3.0
	adafruit/Adafruit AHTX0@^2.0.6
	dfrobot/DFRobot_ENS160@^1.0.1
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	iavorvel/MyLD2410@^1.2.8
	lvgl/lvgl@8.3.11
	adafruit/Adafruit ILI9341@^1.6.0
	adafruit/Adafruit GFX Library@^1.11.9
