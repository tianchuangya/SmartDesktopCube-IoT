<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能桌面魔方 - Logo预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 22px; color: #81D4FA; margin-bottom: 30px; font-weight: 400; }
    .logo-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-card img { max-width: 100%; border-radius: 8px; }
    .logo-card .label { color: #888; font-size: 13px; }
    .logo-card .desc { color: #666; font-size: 12px; text-align: center; }
    .nav-preview {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }
    .nav-preview img { height: 48px; }
    .nav-preview .nav-text { color: #555; font-size: 13px; }
    .favicon-preview {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .favicon-preview img { width: 32px; height: 32px; border-radius: 4px; }
    .favicon-preview .label { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>智能桌面魔方 · 产品Logo资源</h1>
    <div class="nav-preview">
      <img src="logo_nav.png" alt="Nav Logo">
      <span class="nav-text">侧边栏导航栏 (240x80)</span>
    </div>
    <div class="favicon-preview">
      <img src="logo_favicon.png" alt="Favicon">
      <span class="label">浏览器标签页图标 (64x60)</span>
    </div>
    <div class="logo-card">
      <img src="logo_horizontal.png" alt="Horizontal Logo">
      <span class="label">横版主Logo - Web管理后台页头 (1920x640)</span>
      <span class="desc">图标 + 产品名 + 英文名 + 核心特性标签 + 渐变装饰线</span>
    </div>
    <div class="logo-card">
      <img src="logo_icon.png" alt="Icon Logo">
      <span class="label">图标版 - App图标 / Favicon源文件 (1024x952)</span>
      <span class="desc">发光立方体 + 二次元角色 + 粒子可视化元素</span>
    </div>
    <div class="logo-card">
      <img src="logo_sidebar.png" alt="Sidebar Logo">
      <span class="label">紧凑侧边栏版 (800x400)</span>
    </div>
    <div class="logo-card">
      <img src="logo_full.png" alt="Full Logo">
      <span class="label">完整方形Logo - 开机画面 / 居中展示 (1024x952)</span>
    </div>
  </div>
</body>
</html>
